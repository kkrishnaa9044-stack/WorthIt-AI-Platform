<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" width="640" height="400" role="img" aria-label="A brand connected to creators, next to a rising bar chart" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <style>
    .bar{transform-box:fill-box;transform-origin:50% 100%;animation:up .9s cubic-bezier(.2,.7,.2,1) both}
    @keyframes up{from{transform:scaleY(0)}to{transform:scaleY(1)}}
    .draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s .7s cubic-bezier(.4,0,.2,1) both}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    .flow{stroke-dasharray:4 7;animation:flow 1.6s linear infinite}
    @keyframes flow{to{stroke-dashoffset:-22}}
    .bob{animation:bob 5s ease-in-out infinite}
    @keyframes bob{50%{transform:translateY(-6px)}}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 2.2s ease-out infinite}
    @keyframes pulse{from{transform:scale(1);opacity:.6}to{transform:scale(3);opacity:0}}
    @media (prefers-reduced-motion:reduce){*{animation:none!important}}
  </style>

  <rect width="640" height="400" rx="28" fill="#111111"/>
  <rect x=".5" y=".5" width="639" height="399" rx="27.5" fill="none" stroke="#2a2a2a"/>

  <!-- connections: brand to creators -->
  <g fill="none" stroke="#f2efe8" stroke-opacity=".4" stroke-width="1.5" stroke-linecap="round">
    <path class="flow" d="M192 186 L278 102"/>
    <path class="flow" d="M192 200 L294 200"/>
    <path class="flow" d="M190 214 L274 304"/>
  </g>

  <!-- brand node -->
  <rect x="108" y="158" width="84" height="84" rx="22" fill="#f2efe8"/>
  <text x="150" y="214" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-size="46" fill="#111111">₹</text>

  <!-- creator nodes -->
  <circle class="bob" cx="300" cy="90" r="26" fill="#2a2a2a" stroke="#f2efe8" stroke-width="1.5"/>
  <circle class="bob" style="animation-delay:-1.6s" cx="330" cy="200" r="34" fill="#f2efe8"/>
  <circle class="bob" style="animation-delay:-3.1s" cx="290" cy="316" r="22" fill="#FF6A1A"/>

  <!-- chart -->
  <line x1="396" y1="320" x2="596" y2="320" stroke="#333333" stroke-width="1.5"/>
  <g fill="#f2efe8" fill-opacity=".9">
    <rect class="bar" style="animation-delay:.05s" x="404" y="270" width="22" height="50" rx="6"/>
    <rect class="bar" style="animation-delay:.15s" x="436" y="242" width="22" height="78" rx="6"/>
    <rect class="bar" style="animation-delay:.25s" x="468" y="256" width="22" height="64" rx="6"/>
    <rect class="bar" style="animation-delay:.35s" x="500" y="210" width="22" height="110" rx="6"/>
    <rect class="bar" style="animation-delay:.45s" x="532" y="182" width="22" height="138" rx="6"/>
    <rect class="bar" style="animation-delay:.55s" x="564" y="144" width="22" height="176" rx="6" fill="#FF6A1A" fill-opacity="1"/>
  </g>
  <path class="draw" pathLength="1" d="M415 246 L447 218 L479 232 L511 186 L543 158 L575 120" fill="none" stroke="#f2efe8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="pulse" cx="575" cy="120" r="6" fill="#FF6A1A"/>
  <circle cx="575" cy="120" r="6" fill="#FF6A1A"/>
</svg>
